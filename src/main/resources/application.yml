server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/achat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: achat-secret-key-minimum-256-bits-for-hs256-algorithm-here
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  verification:
    code-expiration-ms: 300000

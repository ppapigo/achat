name: AChat Matching Concurrency

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/main/java/com/achat/match/**"
      - "src/main/java/com/achat/common/RoomExecution.java"
      - "src/test/java/com/achat/SecurityHardeningTests.java"
      - "build.gradle"
      - ".github/workflows/matching-concurrency.yml"

jobs:
  matching-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run matchmaking concurrency regression tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon \
            --tests 'com.achat.SecurityHardeningTests.concurrentQueueJoinsCreateOneEntry' \
            --tests 'com.achat.SecurityHardeningTests.simultaneousMatchingAndRejoiningCannotAssignAUserTwice'
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matching-test-results
          path: |
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: ignore

name: Deploy Achat independently
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: achat-production
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .

          push: true
          tags: ghcr.io/ppapigo/achat-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: achat-front/Dockerfile

          push: true
          tags: ghcr.io/ppapigo/achat-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy Achat without changing shared proxy or database
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 30m
          script: |
            set -eu
            # Preserve the existing operational checkout, local changes and credentials.
            PROJECT="$HOME/achat"
            test -s "$PROJECT/.env.prod" || { echo "Existing Achat .env.prod missing; refusing deploy"; exit 1; }
            DEPLOY_ROOT="$HOME/.achat-actions/releases"
            RELEASE_DIR="$DEPLOY_ROOT/$APP_IMAGE_TAG"
            mkdir -p "$DEPLOY_ROOT"
            if [ ! -e "$RELEASE_DIR" ]; then
              git clone --quiet --depth 1 --branch main https://github.com/ppapigo/achat.git "$RELEASE_DIR"
            fi
            test -d "$RELEASE_DIR/.git" || { echo "Release checkout invalid"; exit 1; }
            ACTUAL_SHA="$(git -C "$RELEASE_DIR" rev-parse HEAD)"
            test "$ACTUAL_SHA" = "$APP_IMAGE_TAG" || { echo "Release SHA mismatch: expected $APP_IMAGE_TAG; got $ACTUAL_SHA"; exit 1; }
            cd "$RELEASE_DIR"
            docker network inspect proxy-net >/dev/null
            export APP_IMAGE_TAG
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            bash "$RELEASE_DIR/scripts/deploy-guard.sh"
